# ============================================================
# CloudDrop - Production Multi-Container Compose (Docker Hub)
# ============================================================
# Run this file anywhere without needing the source code!
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # Database Service: MongoDB
  mongo:
    image: mongo:7.0
    container_name: clouddrop_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-mern_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - clouddrop_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend REST API Service
  backend:
    image: ${DOCKERHUB_USERNAME:-yourusername}/clouddrop-backend:latest
    container_name: clouddrop_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongo:27017/${MONGO_DB_NAME:-mern_db}?authSource=admin
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - clouddrop_network

  # Frontend UI Service
  frontend:
    image: ${DOCKERHUB_USERNAME:-yourusername}/clouddrop-frontend:latest
    container_name: clouddrop_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - clouddrop_network

  # Reverse Proxy Service Gateway
  nginx:
    image: ${DOCKERHUB_USERNAME:-yourusername}/clouddrop-gateway:latest
    container_name: clouddrop_nginx
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - clouddrop_network

volumes:
  mongo_data:
    name: clouddrop_mongo_data
  backend_uploads:
    name: clouddrop_backend_uploads

networks:
  clouddrop_network:
    name: clouddrop_network
    driver: bridge
